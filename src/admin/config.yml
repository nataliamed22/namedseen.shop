# Згенеровано з tools/cms-config.src.yml — редагуй той файл і запусти tools/build-cms-config.py
backend:
  name: github
  repo: OWNER/namedseen
  branch: main
  base_url: https://api.netlify.com
  commit_messages:
    create: 'Додано: {{collection}} «{{slug}}»'
    update: 'Оновлено: {{collection}} «{{slug}}»'
    delete: 'Видалено: {{collection}} «{{slug}}»'
    uploadMedia: Завантажено «{{path}}»
    deleteMedia: Видалено «{{path}}»
local_backend: true
locale: uk
site_url: https://namedseen.com
display_url: https://namedseen.com
media_folder: src/img/uploads
public_folder: /img/uploads
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
collections:
- name: pages
  label: Сторінки
  label_singular: Сторінку
  description: Головна, оферта, повернення, контакти й будь-які нові сторінки. Відкрий сторінку → меню «⋯» → Duplicate, щоб зробити копію.
  folder: src/pages
  create: true
  extension: md
  format: frontmatter
  slug: '{{slug}}'
  preview_path: '{{slug}}'
  summary: '{{title}}'
  fields:
  - label: Назва сторінки
    name: title
    widget: string
  - label: Опис для Google
    name: description
    widget: text
    required: false
  - label: Це головна сторінка
    name: isHome
    widget: hidden
    required: false
  - label: Адреса
    name: permalink
    widget: hidden
    required: false
  - label: Блоки сторінки
    name: blocks
    widget: list
    hint: Додавай блоки кнопкою «Add», перетягуй за ручку, щоб поміняти порядок
    types:
    - label: Hero — перший екран
      name: hero
      widget: object
      summary: Hero · {{fields.title}}
      fields:
      - label: Надпис над заголовком
        name: eyebrow
        widget: string
        required: false
      - label: Заголовок
        name: title
        widget: text
        hint: Новий рядок = перенос. *Слово* = курсив акцентом
      - label: Текст
        name: text
        widget: text
        required: false
      - label: Картинка
        name: image
        widget: image
        required: false
      - label: Опис картинки (для Google)
        name: image_alt
        widget: string
        required: false
      - label: Формат картинки
        name: ratio
        widget: select
        required: false
        default: default
        options:
        - label: Як задумано в дизайні
          value: default
        - label: Квадрат 1:1
          value: 1/1
        - label: Вертикальна 4:5
          value: 4/5
        - label: Вертикальна 3:4
          value: 3/4
        - label: Висока 2:3
          value: 2/3
        - label: Горизонтальна 4:3
          value: 4/3
        - label: Горизонтальна 3:2
          value: 3/2
        - label: Широка 16:9
          value: 16/9
        - label: Оригінальна, без обрізання
          value: original
      - label: Кнопка 1 — текст
        name: button_label
        widget: string
        required: false
      - label: Кнопка 1 — посилання
        name: button_url
        widget: string
        required: false
      - label: Кнопка 2 — текст
        name: button2_label
        widget: string
        required: false
      - label: Кнопка 2 — посилання
        name: button2_url
        widget: string
        required: false
      - label: Сховати блок
        name: hidden
        widget: boolean
        default: false
        required: false
      - label: Анімація при прокрутці
        name: animate
        widget: boolean
        default: true
        required: false
      - label: 'Якір (для посилань #…)'
        name: anchor
        widget: string
        required: false
        hint: 'Наприклад faq — кнопка з посиланням #faq прокрутить сюди'
